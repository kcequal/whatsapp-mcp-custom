# Stopped running on every push to main (2026-08-23). Root cause: the default
# GitHub Actions token on this repo cannot open PRs (repo Settings > Actions >
# "Allow GitHub Actions to create and approve pull requests" is off, which is
# the sane default), and no RELEASE_PLEASE_TOKEN PAT secret has been provisioned
# to work around that. Fixing it properly needs one of those two things granted
# by a repo admin -- a real decision, not a workflow-file change.
#
# It also has no consumer here: this fork has cut 0 tags and 0 releases in its
# history, and the only thing that ships from this repo (Buddy's bridge deploy,
# see deploy/instance/bootstrap.sh WHATSAPP_MCP_REF) pins a raw commit SHA, never
# a release tag. So until someone actually wants tagged releases + changelogs
# out of this fork, there is nothing this workflow does that anything downstream
# depends on -- leaving it on `push` was pure noise (an email per push, always
# failing). Kept as workflow_dispatch so it can still be run by hand if that
# changes; not deleted, since the config (release-please-config.json) is fine
# and the fix path above may be worth it later.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-assets:
    name: Publish Release Artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Validate version consistency
        run: python .github/scripts/check_versions.py --tag "${{ needs.release-please.outputs.tag_name }}"

      - name: Build release artifacts
        run: |
          mkdir -p dist

          cd whatsapp-bridge
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -tags sqlite_fts5 -o ../dist/whatsapp-bridge-linux-amd64 .
          cd ..

          cd whatsapp-mcp-server
          uv build --out-dir ../dist
          cd ..

          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
